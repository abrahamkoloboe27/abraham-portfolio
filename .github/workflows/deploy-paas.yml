name: Deploy — PaaS (Vercel + Render/Fly)

# Alternative sans serveur au déploiement VPS :
#   • site public et console admin sur Vercel
#   • API Python sur Render (deploy hook) ou Fly.io
#   • base de données sur Supabase / Neon
#
# Chaque étape est ignorée proprement si ses secrets ne sont pas renseignés,
# ce qui permet de n'activer que la partie souhaitée.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-paas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ web
  vercel-web:
    name: Site public → Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vérifier la configuration
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID_WEB }}" ]; then
            echo "::notice::Secrets Vercel absents — déploiement du site ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Déployer
        if: steps.guard.outputs.ok == 'true'
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

  # ---------------------------------------------------------------- admin
  vercel-admin:
    name: Console admin → Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vérifier la configuration
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID_ADMIN }}" ]; then
            echo "::notice::Secrets Vercel absents — déploiement de l'admin ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Déployer
        if: steps.guard.outputs.ok == 'true'
        working-directory: admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

  # ------------------------------------------------------------------ api
  render-api:
    name: API → Render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Déclencher le déploiement
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK absent — déploiement de l'API ignoré."
            exit 0
          fi
          echo "Déclenchement du déploiement Render…"
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Déploiement demandé."

  fly-api:
    name: API → Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vérifier la configuration
        id: guard
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::notice::FLY_API_TOKEN absent — déploiement Fly.io ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.guard.outputs.ok == 'true'

      - name: Déployer
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

  # ------------------------------------------------------- migrations DB
  migrate:
    name: Migrations de la base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [render-api, fly-api]
    if: always()
    steps:
      - name: Vérifier la configuration
        id: guard
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::notice::DATABASE_URL absent — migrations ignorées (elles sont appliquées au démarrage du conteneur)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'

      - uses: astral-sh/setup-uv@v5
        if: steps.guard.outputs.ok == 'true'

      - name: Appliquer les migrations
        if: steps.guard.outputs.ok == 'true'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e .
          .venv/bin/alembic upgrade head
