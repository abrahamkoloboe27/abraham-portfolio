[project]
name = "abraham-portfolio-api"
version = "1.0.0"
description = "Backend API for Abraham Zacharie KOLOBOE's portfolio (public site + admin console)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Abraham Zacharie KOLOBOE", email = "abklb27@gmail.com" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "python-slugify>=8.0.4",
    "httpx>=0.27.2",
    "boto3>=1.35.0",
    "pillow>=11.0.0",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "markdown-it-py>=3.0.0",
    "feedgen>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-python-slugify>=8.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# `extend-exclude` keeps ruff's built-in excludes (.venv, __pycache__, …).
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI declares dependencies as argument defaults
    "RUF012",  # SQLAlchemy/Pydantic class attributes are not ClassVar
    "RUF001",  # French copy legitimately uses typographic characters
    "RUF002",
    "RUF003",
    "UP046",   # Pydantic generics stay on `Generic[T]` for wider tooling support
]

[tool.ruff.lint.per-file-ignores]
# Package facades re-export names on purpose; `__all__` is built dynamically.
"app/schemas/__init__.py" = ["F401"]
"app/models/__init__.py" = ["F401"]
"app/api/v1/admin/__init__.py" = ["C408"]  # dict(...) keeps the resource table readable
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = ["alembic/"]
