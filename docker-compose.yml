# Environnement de développement complet : base, stockage, mail, API et interfaces.
#
#   docker compose up -d --build
#
# Site public  : http://localhost:3000
# Admin        : http://localhost:5173
# API + docs   : http://localhost:8000/docs
# MinIO console: http://localhost:9001  (portfolio / portfolio123)
# Mailpit      : http://localhost:8025

name: abraham-portfolio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage — same API as Supabase Storage, so `STORAGE_BACKEND=s3`
  # behaves locally exactly as it will in production.
  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-portfolio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-portfolio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 ${S3_ACCESS_KEY_ID:-portfolio} ${S3_SECRET_ACCESS_KEY:-portfolio123} &&
      mc mb --ignore-existing local/${S3_BUCKET:-portfolio-media} &&
      mc anonymous set download local/${S3_BUCKET:-portfolio-media} &&
      echo 'bucket prêt'
      "
    restart: "no"

  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@db:5432/${POSTGRES_DB:-portfolio}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-0123456789abcdef}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      ADMIN_SITE_URL: ${ADMIN_SITE_URL:-http://localhost:5173}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-abklb27@gmail.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-ChangeMe!2026}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: http://storage:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-portfolio-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-portfolio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-portfolio123}
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      RUN_MIGRATIONS: "true"
      RUN_SEED: "${RUN_SEED:-true}"
    ports:
      - "8000:8000"
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:8000}
        VITE_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  db_data:
  storage_data:
  api_uploads:
